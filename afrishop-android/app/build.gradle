plugins {
    id 'com.android.application'
}

// Signature : la clé d'envoi Google Play est fournie par variables d'environnement
// (secrets GitHub) ou par un fichier keystore.properties local (jamais commité).
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def ksPath = System.getenv('AFRISHOP_KEYSTORE') ?: ksProps['storeFile']
def hasSigning = ksPath != null && file(ksPath).exists()

android {
    namespace 'online.afrishopp.app'
    compileSdk 36

    defaultConfig {
        applicationId 'online.afrishopp.app'
        minSdk 23
        targetSdk 36
        // Incrémenté automatiquement par GitHub Actions à chaque build
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '1.0'
    }

    signingConfigs {
        if (hasSigning) {
            upload {
                storeFile file(ksPath)
                storePassword System.getenv('AFRISHOP_KEYSTORE_PASSWORD') ?: ksProps['storePassword']
                keyAlias System.getenv('AFRISHOP_KEY_ALIAS') ?: ksProps['keyAlias']
                keyPassword System.getenv('AFRISHOP_KEY_PASSWORD') ?: ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

name: AfriShop Android

on:
  push:
    paths:
      - 'afrishop-android/**'
      - '.github/workflows/afrishop-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afrishop-android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Préparer la clé d'envoi Google Play (si les secrets existent)
        env:
          KEYSTORE_B64: ${{ secrets.AFRISHOP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "AFRISHOP_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Clé trouvée : l'AAB sera signé."
          else
            echo "::warning::Secret AFRISHOP_KEYSTORE_BASE64 absent : l'AAB ne sera PAS signé."
          fi

      - name: Construire l'AAB (Google Play) et l'APK
        env:
          AFRISHOP_KEYSTORE_PASSWORD: ${{ secrets.AFRISHOP_KEYSTORE_PASSWORD }}
          AFRISHOP_KEY_ALIAS: ${{ secrets.AFRISHOP_KEY_ALIAS }}
          AFRISHOP_KEY_PASSWORD: ${{ secrets.AFRISHOP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: AfriShop-${{ env.VERSION_NAME }}
          path: |
            afrishop-android/app/build/outputs/bundle/release/*.aab
            afrishop-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
